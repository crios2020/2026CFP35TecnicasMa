<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- Lightbox2 CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.12.0/css/lightbox.min.css">


</head>

<body>

    <!-- Bloque de comentarios -->
    <!-- Usamos la extensión Live Server Ritwick Dey -->
    <h1>Tablas en HTML</h1>

    <p>Hoy es Miércoles 4 de noviembre</p>

    <table border=1> <!-- table etiqueta de tabla -->
        <tr> <!-- tr Table Row - Fila -->
            <th>País</th>
            <th>Habitantes</th>
            <!-- td Table Data - Celda -->
        </tr>
        <tr>
            <td>Argentina</td>
            <td>50 Millones</td>
        </tr>
        <tr>
            <td>Brasil</td>
            <td>280 Millones</td>
        </tr>
        <tr>
            <td>Uruguay</td>
            <td>12 Millones</td>
        </tr>
    </table>

    <!-- image -->
    <img src="img/Perro_Caniche.png" alt="Perro Caniche" width="320" height="240">
    <img src="img/Perro_Maltes.png" alt="Perro Maltes" width="320" height="240">
    <img src="img/Perro_Salchicha.png" alt="Perro Salchicha" width="320" height="240">
    <img src="img/Perro_Shitzu.png" alt="Perro Shitzu" width="320" height="240">

    <table>
        <tr>
            <td>
                <a href="img/Perro_Caniche.png">
                    <img src="img/Perro_Caniche.png" alt="Perro Caniche" width="240" height="180">
                </a>
            </td>
            <td>
                <a href="img/Perro_Maltes.png">
                    <img src="img/Perro_Maltes.png" alt="Perro Maltez" width="240" height="180">
                </a>
            </td>
        </tr>
        <tr>
            <td>
                <a href="img/Perro_Salchicha.png">
                    <img src="img/Perro_Salchicha.png" alt="Perro Salchicha" width="240" height="180">
                </a>
            </td>
            <td>
                <a href="img/Perro_Shitzu.png">
                    <img src="img/Perro_Shitzu.png" alt="Perro Shitzu" width="240" height="180">
                </a>
            </td>
        </tr>
    </table>


    <!-- Table con Ligthbox2-->
    <table>
        <tr>
            <td>
                <a href="img/Perro_Caniche.png" data-lightbox="perros" data-title="Perro poodle">
                    <img src="img/Perro_Caniche.png" alt="Perro_Caniche" width="240" height="180">
                </a>   
            </td>
            <td>
                <a href=" img/Perro_Maltes.png" data-lightbox="perros" data-title="Perro maltes">
                    <img src="img/Perro_Maltes.png" alt="Perro_Maltes" width="240" height="180">
                </a>
            </td>
        </tr>
        <tr>
            <td>
                <a href="img/Perro_Salchicha.png" data-lightbox="perros" data-title="Perro salchicha">
                    <img src="img/Perro_Salchicha.png" alt="Perro_Salchicha" width="240" height="180">
                </a>
            </td>
            <td>
                <a href="img/Perro_Shitzu.png" data-lightbox="perros" data-title="Perro shitzu">
                    <img src="img/Perro_Shitzu.png" alt="Perro_Shitzu" width="240" height="180">
                </a>
            </td>
        </tr>
    </table>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Lightbox2 JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.12.0/js/lightbox.min.js"></script>
</body>

</html>
